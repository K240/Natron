name: Qt 6 MSVC build and tests

on:
  workflow_dispatch: {}
  push:
    branches: [RB-2.6]
  pull_request:
    branches: [RB-2.6]

permissions:
  contents: read

jobs:
  windows-qt6:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - name: Install matching Qt SDK
        run: uv tool run --from aqtinstall aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 -O '${{ runner.temp }}\Qt'
      - name: Build with MSVC and CMake
        run: .\tools\build-windows-qt6.ps1 -QtRoot '${{ runner.temp }}\Qt\6.11.2\msvc2022_64' -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT -Jobs 4
      - name: Run native tests
        run: .\tools\run-windows-qt6.ps1 -QtRoot '${{ runner.temp }}\Qt\6.11.2\msvc2022_64' -Program CTest
      - name: Render and reload a project through Python
        run: .\tools\run-windows-qt6.ps1 -QtRoot '${{ runner.temp }}\Qt\6.11.2\msvc2022_64' -Program Smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-qt6-test-log
          path: build/windows-qt6/Testing/Temporary/LastTest.log
